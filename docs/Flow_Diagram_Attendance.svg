  <text x="375.71250000000003" y="220" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.85">POST /login/begin { username }</text>
</g>
<g class="message" data-from="Gin" data-to="U" data-label="Assertion options { publicKey: ... }" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="658.8785" y1="270" x2="92.5465" y2="270" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <rect x="253.21250000000003" y="251.85" width="245" height="16.3" rx="2" ry="2" fill="var(--bg)" />
  <text x="375.71250000000003" y="260" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.85">Assertion options { publicKey: ... }</text>
</g>
<g class="message" data-from="U" data-to="Auth" data-label="startAuthentication({ optionsJSON: options.publicKey })" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="92.5465" y1="310" x2="874.3595" y2="310" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <rect x="300.95300000000003" y="291.85" width="365" height="16.3" rx="2" ry="2" fill="var(--bg)" />
  <text x="483.45300000000003" y="300" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.85">startAuthentication({ optionsJSON: options.publicKey })</text>
</g>
<g class="message" data-from="Auth" data-to="U" data-label="AuthenticationResponseJSON (id, rawId, type, signature)" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="874.3595" y1="350" x2="92.5465" y2="350" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
