  <text x="658.8785" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">appsensi-server (:8080)</text>
</g>
<g class="actor" data-id="Auth" data-label="WebAuthn Authenticator" data-type="participant">
  <rect x="786.9895" y="30" width="174.74" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="874.3595" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">WebAuthn Authenticator</text>
</g>
