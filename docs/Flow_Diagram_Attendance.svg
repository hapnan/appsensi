</g>
<g class="message" data-from="U" data-to="Gin" data-label="POST /login/finish { username, ...assertion }" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="92.5465" y1="390" x2="658.8785" y2="390" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <rect x="224.71250000000003" y="371.85" width="302" height="16.3" rx="2" ry="2" fill="var(--bg)" />
  <text x="375.71250000000003" y="380" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.85">POST /login/finish { username, ...assertion }</text>
</g>
<g class="message" data-from="Gin" data-to="U" data-label="200 OK { status: &quot;login success&quot; }" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="658.8785" y1="430" x2="92.5465" y2="430" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <rect x="259.71250000000003" y="411.85" width="232" height="16.3" rx="2" ry="2" fill="var(--bg)" />
  <text x="375.71250000000003" y="420" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.85">200 OK { status: &quot;login success&quot; }</text>
</g>
<g class="message" data-from="U" data-to="App" data-label="trpc.attendance.checkIn({ room, studentId, scheduleId, date })" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="92.5465" y1="470" x2="441.1745" y2="470" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <rect x="62.3605" y="451.85" width="409" height="16.3" rx="2" ry="2" fill="var(--bg)" />
  <text x="266.8605" y="460" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.85">trpc.attendance.checkIn({ room, studentId, scheduleId, date })</text>
</g>
<g class="message" data-from="App" data-to="U" data-label="200 OK CheckInResult (id, name, checkedInAt)" data-line-style="dashed" data-arrow-head="filled" data-self="false">
