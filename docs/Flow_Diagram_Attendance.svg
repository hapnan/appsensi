  <polyline points="92.5465,170 122.5465,170 122.5465,190 92.5465,190" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <rect x="127.5465" y="171.85" width="352" height="16.3" rx="2" ry="2" fill="var(--bg)" />
