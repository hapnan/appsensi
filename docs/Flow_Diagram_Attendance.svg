  <rect x="119.3605" y="491.85" width="295" height="16.3" rx="2" ry="2" fill="var(--bg)" />
  <text x="266.8605" y="500" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.85">200 OK CheckInResult (id, name, checkedInAt)</text>
</g>
<g class="message" data-from="U" data-to="U" data-label="Exit animation -&gt; Present count +1, Toast confirmation" data-line-style="solid" data-arrow-head="filled" data-self="true">
