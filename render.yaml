projects:
  - name: My-project
    environments:
      - name: production
        services:
          - type: web
            runtime: node
            name: tanstack-start-app
            repo: https://github.com/hapnan/appsensi
            region: singapore
            plan: 0.5c-512mb
            buildCommand: bun install && bun run build
            startCommand: bun run start
            maxShutdownDelaySeconds: 120
            envVars:
              - key: NITRO_PRESET
                value: render-com
              - key: HOST
                value: 0.0.0.0