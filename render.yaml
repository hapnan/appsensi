projects:
  - name: My-project
    environments:
      - name: production
        services:
          - type: web
            runtime: node
            name: appsensi-frontend
            repo: https://github.com/hapnan/appsensi
            region: singapore
            plan: 0.5c-512mb
            buildCommand: bun install && bun run build
            startCommand: bun run start
            maxShutdownDelaySeconds: 120
            domain: hapnanarsad.id
            preDeployCommand: bun run db:push
            initialDeployHook: bun run db:seed
            envVars:
              - key: NITRO_PRESET
                value: render-com
              - key: HOST
                value: 0.0.0.0
              - key: DATABASE_URL
                fromDatabase:
                  name: appsensi-db
                  property: connectionString
              - key: VITE_APP_TITLE
                value: Appsensi
              - key: VITE_WEBAUTHN_SERVER_URL
                value: https://passkey.hapnanarsad.id
              - key: SERVER_URL
                value: https://hapnanarsad.id
          - type: web
            runtime: go
            name: Appsensi-server
            repo: https://github.com/hapnan/appsensi-server
            region: singapore
            plan: 0.5c-512mb
            buildCommand: go build -tags netgo -ldflags '-s -w' -o app
            startCommand: ./app
            maxShutdownDelaySeconds: 120
            domain: passkey.hapnanarsad.id
            envVars:
              - key: ALLOWED_ORIGINS
                value: https://hapnanarsad.id
              - key: RP_ID
                value: hapnanarsad.id
        databases:
          - name: appsensi-db
            region: singapore
            plan: 0.1c-256mb
            postgresMajorVersion: "18"
            databaseName: appsensi
            user: appsensi
